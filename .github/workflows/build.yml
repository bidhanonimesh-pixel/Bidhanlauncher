name: Build Bidhan Launcher APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Project Zip
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Build Debug APK
        run: |
          PROJ_DIR=$(find . -name "build.gradle.kts" | grep -v "/app/" | head -n 1)
          if [ -n "$PROJ_DIR" ]; then
            cd $(dirname "$PROJ_DIR")
            chmod +x gradlew || true
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --no-daemon
            else
              gradle assembleDebug --no-daemon
            fi
          else
            echo "build.gradle.kts পাওয়া যায়নি!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bidhan-launcher-debug
          path: '**/build/outputs/apk/debug/*.apk'
