name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Auto Extract Zip if exists
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_app
          fi

      - name: Build APK with Gradle
        run: |
          # gradlew ফাইল থাকলে সেটা দিয়ে বিল্ড করবে, না থাকলে সিস্টেমে ইনস্টল করা gradle দিয়ে বিল্ড করবে
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            cd $(dirname "$GRADLEW_PATH")
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # gradlew ফাইল না থাকলেও প্রজেক্ট ফোল্ডারে ঢুকে সরাসরি gradle দিয়ে বিল্ড করবে
            BUILD_FILE=$(find . -name "build.gradle*" | head -n 1)
            if [ -n "$BUILD_FILE" ]; then
              cd $(dirname "$BUILD_FILE")
              gradle assembleDebug
            else
              echo "No build.gradle file found!"
              exit 1
            fi
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'
