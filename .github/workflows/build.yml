name: Android APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Zip File
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE" -d extracted_app
          fi

      - name: Auto Fix Code & Build APK
        run: |
          PROJ_DIR=$(find . -name "build.gradle.kts" | grep -v "/app/" | head -n 1)
          if [ -n "$PROJ_DIR" ]; then
            cd $(dirname "$PROJ_DIR")
            
            # 1. Compose Compiler Plugin যুক্ত করা
            if [ -f "app/build.gradle.kts" ]; then
              if ! grep -q "org.jetbrains.kotlin.plugin.compose" app/build.gradle.kts; then
                sed -i 's/plugins {/plugins {\n    id("org.jetbrains.kotlin.plugin.compose") version "2.0.0"/' app/build.gradle.kts
              fi
            fi

            # 2. AppDrawerScreen.kt ফাইলে missing clickable import যুক্ত করা
            FILE_PATH=$(find . -name "AppDrawerScreen.kt" | head -n 1)
            if [ -n "$FILE_PATH" ]; then
              if ! grep -q "androidx.compose.foundation.clickable" "$FILE_PATH"; then
                sed -i '1s/^/import androidx.compose.foundation.clickable\n/' "$FILE_PATH"
              fi
            fi

            chmod +x gradlew || true
            if [ -f "./gradlew" ]; then
              ./gradlew assembleDebug --no-daemon
            else
              gradle assembleDebug --no-daemon
            fi
          else
            echo "build.gradle.kts পাওয়া যায়নি!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bidhan-launcher-debug
          path: '**/build/outputs/apk/debug/*.apk'
